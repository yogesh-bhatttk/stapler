name: Release

# Audit 2026-09-25 GAP-8, tightened by audit 2026-10-01 PLT-7 / DIST-07 —
# pushing a `v*` tag builds once, tests what was built, and drafts a GitHub
# Release from exactly those bytes.
#
#   build    `pnpm package` (scripts/package.mjs): all three targets, the
#            zero-permission and version invariants re-checked on the built
#            manifests, no e2e test hook, no sourcemaps, reproducible
#            timestamps; `addons-linter` on the Firefox zip; uploads
#            dist/release (chrome, firefox and web zips, one `.sha256` per zip,
#            SHA256SUMS, BUILD_INFO.txt) as the `release` artifact. Nothing
#            later rebuilds it.
#   check    lint, types, tokens, invariants, unit tests (source-level).
#   bundle-network, e2e-extension, e2e-web-shipped
#            unpack the artifact's zips and test *those*: the bundle scan runs
#            on all three, the packaged-extension e2e loads the shipped Chrome
#            zip, and the zero-network, offline (PWA), share-target and
#            worker-network suites run against the unzipped web zip as it is,
#            with no test hooks (`tests/e2e/pwa-shipped.config.ts`).
#   e2e-web, perf
#            every other web suite needs the e2e test hooks
#            (`VITE_E2E_TEST_HOOKS`), which the shipped site deliberately does
#            not contain, so these build their own instrumented copy of the
#            same commit. They gate the release too.
#   release  needs every job above, re-verifies the artifact's checksums and
#            creates a *draft* release with the artifact's files. A human
#            reviews and publishes the draft (RELEASE_CHECKLIST.md).
#
# Nothing here needs a secret beyond the job's own GITHUB_TOKEN, and nothing
# is uploaded anywhere but this repository's Actions artifacts and Releases
# page — store submission stays a manual step.
#
#   git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and package (once)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Exact; satisfies package.json devEngines (^11.20.0), which action-setup
          # doesn't read. Same version docs/AMO_SOURCE_BUILD.md cites.
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      - run: pnpm package
      - name: Verify checksums
        working-directory: dist/release
        run: |
          sha256sum --check SHA256SUMS
          for sum in *.zip.sha256; do sha256sum --check "$sum"; done
      # Audit 2026-10-10: Mozilla's own linter on the exact Firefox zip, pinned.
      # Errors fail the release; warnings are printed for the reviewer.
      - name: addons-linter (Firefox zip)
        run: pnpm dlx addons-linter@10.13.0 dist/release/stapler-*-firefox.zip
      - run: cat dist/release/BUILD_INFO.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  check:
    name: Lint, types, tokens, invariants, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  bundle-network:
    name: Bundle zero-network scan (shipped zips)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Unpack the shipped zips
        run: |
          # unzip -d creates only the last path segment; make the parents first.
          for target in chrome firefox web; do
            mkdir -p "shipped/$target"
            unzip -q release/stapler-*-"$target".zip -d "shipped/$target"
          done
      - run: node scripts/check-bundle-network.mjs shipped/chrome shipped/firefox shipped/web

  e2e-extension:
    name: E2E (the shipped Chrome zip)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      # The extension suite loads `dist/ext`; put the shipped zip's contents there.
      - run: mkdir -p dist/ext && unzip -q release/stapler-*-chrome.zip -d dist/ext
      - run: pnpm test:e2e:ext
        env:
          STAPLER_EXT_PREBUILT: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-release-extension
          path: playwright-report/
          retention-days: 14

  e2e-web-shipped:
    # Audit 2026-10-01 PLT-7 — the shipped web bytes themselves, no rebuild and
    # no test hooks: zero-network, offline after one visit, share target,
    # and the service worker's own requests.
    name: E2E (the shipped web zip)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Unpack the shipped web zip
        run: mkdir -p shipped/web && unzip -q release/stapler-*-web.zip -d shipped/web
      - name: Confirm it is the shipped build (no test hooks)
        run: |
          # The e2e build's service-worker opt-in key (src/ui/pwa.ts) is
          # compiled out of a build without VITE_E2E_TEST_HOOKS. package.mjs
          # already refuses to zip a build containing it (audit 2026-10-10);
          # this re-checks the bytes that were actually uploaded.
          if grep -rlq --exclude='*.map' 'stapler:e2e-service-worker' shipped/web; then
            echo "::error::The shipped web zip contains the e2e opt-in hook"
            exit 1
          fi
      - run: pnpm exec playwright test -c tests/e2e/pwa-shipped.config.ts
        env:
          STAPLER_SHIPPED_WEB: shipped/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-release-web-shipped
          path: playwright-report/
          retention-days: 14

  e2e-web:
    name: E2E (web preview, instrumented build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-release-web
          path: playwright-report/
          retention-days: 14

  perf:
    # PLAN §5.1 budgets, never retried (audit PLT-18) — a release gate too.
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:perf
        env:
          STAPLER_PERF_SLACK: '1.5'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-release-perf
          path: playwright-report/
          retention-days: 14

  release:
    name: Draft the GitHub Release
    needs: [build, check, bundle-network, e2e-extension, e2e-web-shipped, e2e-web, perf]
    runs-on: ubuntu-latest
    permissions:
      # Creating a release and uploading its assets.
      contents: write
    steps:
      # Checked out only so `gh` knows the repository; nothing is built here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Verify checksums
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          for sum in *.zip.sha256; do sha256sum --check "$sum"; done
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # v1.2.3-beta.1 and the like are marked as pre-releases.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip release/*.zip.sha256 release/SHA256SUMS release/BUILD_INFO.txt \
            --draft \
            --verify-tag \
            --title "Stapler ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${flags[@]}"
