name: Release dry run

# Audit 2026-10-10 — the release pipeline used to run only on a `v*` tag, so a
# change to the packaging scripts, the workflows, the Vite config or the
# manifest was first exercised by an actual release. This runs the same
# packaging (`pnpm package`: all three builds, the manifest invariants, the
# e2e-hook refusal, the zips and checksums), `validate:builds` and the pinned
# addons-linter on every pull request that touches those files, and on demand.
# It publishes nothing: no release, no upload beyond this run's own logs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'vite.config.ts'
      - 'public/manifest.json'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (dry run, nothing published)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Exact; satisfies package.json devEngines (^11.20.0).
          version: 11.28.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - run: pnpm validate:builds
      - name: Verify checksums
        working-directory: dist/release
        run: |
          sha256sum --check SHA256SUMS
          for sum in *.zip.sha256; do sha256sum --check "$sum"; done
      - name: addons-linter (Firefox zip)
        run: pnpm dlx addons-linter@10.13.0 dist/release/stapler-*-firefox.zip
      - run: cat dist/release/BUILD_INFO.txt
